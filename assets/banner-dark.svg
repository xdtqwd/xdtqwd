<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="xdtqwd: Go Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0e2230"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1f6f8b"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ADD8"/>
    </marker>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .packet { animation: travel 4s ease-in-out infinite; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(324px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .packet { animation: none; }
      .packet { opacity: 0; }
    }
  </style>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)" mask="url(#fadeMask)"/>

  <text x="64" y="80" class="mono" font-size="18" fill="#00ADD8">$ whoami</text>
  <rect class="cursor" x="156" y="65" width="10" height="19" fill="#00ADD8"/>
  <text x="64" y="146" class="sans" font-size="54" font-weight="700" fill="#e6edf3">Go Backend Developer</text>
  <text x="64" y="190" class="sans" font-size="21" fill="#9aa7b4">Пишу сервисы, которые не теряют события</text>
  <text x="64" y="218" class="sans" font-size="21" fill="#9aa7b4">и не списывают деньги дважды</text>
  <text x="64" y="258" class="mono" font-size="15" fill="#6e7b88">PostgreSQL · Kafka · Redis · Kubernetes · Prometheus</text>

  <text x="744" y="96" class="mono" font-size="14" fill="#6e7b88">// путь события в order-service</text>
  <rect x="744" y="118" width="86" height="50" rx="10" fill="#161b22" stroke="#2b3440" stroke-width="1.5"/>
  <text x="787" y="149" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">order</text>
  <text x="787" y="194" text-anchor="middle" class="mono" font-size="13" fill="#6e7b88">tx</text>
  <line x1="833" y1="143" x2="848" y2="143" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="852" y="118" width="86" height="50" rx="10" fill="#161b22" stroke="#2b3440" stroke-width="1.5"/>
  <text x="895" y="149" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">outbox</text>
  <text x="895" y="194" text-anchor="middle" class="mono" font-size="13" fill="#6e7b88">relay</text>
  <line x1="941" y1="143" x2="956" y2="143" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="960" y="118" width="86" height="50" rx="10" fill="#161b22" stroke="#2b3440" stroke-width="1.5"/>
  <text x="1003" y="149" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">kafka</text>
  <text x="1003" y="194" text-anchor="middle" class="mono" font-size="13" fill="#6e7b88">topic</text>
  <line x1="1049" y1="143" x2="1064" y2="143" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1068" y="118" width="86" height="50" rx="10" fill="#161b22" stroke="#2b3440" stroke-width="1.5"/>
  <text x="1111" y="149" text-anchor="middle" class="mono" font-size="16" fill="#e6edf3">inbox</text>
  <text x="1111" y="194" text-anchor="middle" class="mono" font-size="13" fill="#6e7b88">dedup</text>
  <line x1="787" y1="232" x2="1111" y2="232" stroke="#00ADD8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="787" cy="232" r="3.5" fill="#0d1117" stroke="#00ADD8" stroke-width="2"/>
  <circle cx="895" cy="232" r="3.5" fill="#0d1117" stroke="#00ADD8" stroke-width="2"/>
  <circle cx="1003" cy="232" r="3.5" fill="#0d1117" stroke="#00ADD8" stroke-width="2"/>
  <circle cx="1111" cy="232" r="3.5" fill="#0d1117" stroke="#00ADD8" stroke-width="2"/>
  <circle class="packet" cx="787" cy="232" r="5" fill="#00ADD8" filter="url(#glow)"/>
</svg>
